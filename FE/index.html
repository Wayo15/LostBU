<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LostBU — Campus Lost & Found</title>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="logo">Lost<span>BU</span></h1>
      </div>
    </header>

    <section class="hero">
      <div class="container">
        <h2>Lost something on campus? Found something?</h2>
        <p>LostBU brings lost and found reports into one organized place, so belongings find their way back to their owners.</p>
      </div>
    </section>

    <main class="container">
      <section aria-label="Summary">
        <div class="stats" id="stats">
          <!-- filled by main.js -->
        </div>
      </section>

      <section class="section" aria-labelledby="recent-title">
        <h2 class="section__title" id="recent-title">Recently reported</h2>
        <div class="item-grid" id="item-list" aria-live="polite">
          <!-- filled by main.js -->
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
